<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <ul id="clocks" class="clocks"></ul>
  <p id="empty" class="empty" hidden>No cities yet. Press <kbd>&#8984;N</kbd> or the + button.</p>
  <footer class="bar">
    <span id="local" class="muted"></span>
    <span class="spacer"></span>
    <span id="today" class="muted"></span>
    <button id="now" class="nowbtn" type="button" hidden></button>
  </footer>
</main>

<dialog id="add">
  <form method="dialog" id="addForm">
    <h2 id="dialogTitle">Add a city</h2>
    <label>Name <input id="name" required autocomplete="off" placeholder="Tokyo"></label>
    <label>Time zone <input id="tz" list="zones" required placeholder="Asia/Tokyo"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label>
    <datalist id="zones"></datalist>
    <menu>
      <button value="cancel" type="button" id="cancel">Cancel</button>
      <button value="add" class="primary" id="dialogPrimary">Add</button>
    </menu>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
